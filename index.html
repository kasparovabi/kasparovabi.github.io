    <style>
        :root {
            --background-color: #1a1a1a;
            --text-color: #FFBF00;
            --link-color: #f0f8ff;
            --glitch-color1: #ff00c1;
            --glitch-color2: #00ffff;
            --scanline-opacity: 0.08;
        }

        body {
            background-color: var(--background-color);
            color: var(--text-color);
            font-family: 'Fira Code', monospace;
            padding: 2rem;
            margin: 0;
            line-height: 1.6;
            font-size: 16px;
            overflow: hidden;
            position: relative;
        }

        #atari-background {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            overflow: hidden; z-index: 0; opacity: 0.05; white-space: pre;
            font-size: 18px; line-height: 1.2;
        }
        
        .invader { position: absolute; animation: fall 20s linear infinite; }

        @keyframes fall {
            0% { transform: translateY(-10vh); }
            100% { transform: translateY(110vh); }
        }

        body::after {
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(0deg, rgba(0,0,0, var(--scanline-opacity)) 50%, transparent 50%);
            background-size: 100% 4px; animation: scanline 15s linear infinite;
            pointer-events: none; z-index: 1;
        }

        @keyframes scanline { 0% { background-position: 0 0; } 100% { background-position: 0 100vh; } }

        .container {
            max-width: 800px; margin: 0 auto; position: relative; z-index: 2;
            text-shadow: 0 0 5px rgba(255, 191, 0, 0.4);
            animation: flicker 0.15s infinite; height: 100vh; overflow-y: auto;
        }
        
        @keyframes flicker {
            0%, 100% { opacity: 1; } 50.2% { opacity: 0.95; } 50.4% { opacity: 1; }
            50.6% { opacity: 0.9; } 50.8% { opacity: 1; }
        }
        
        a {
            color: var(--link-color);
            font-weight: 700;
            text-decoration: none;
            position: relative;
            display: inline-block;
            text-shadow: 0 0 7px rgba(240, 248, 255, 0.7);
        }

        a:hover::before, a:hover::after {
            content: attr(data-text); position: absolute; top: 0; left: 0;
            width: 100%; height: 100%; background: var(--background-color);
            overflow: hidden; clip: rect(0, 0, 0, 0);
        }
        a:hover::before {
            left: -2px; text-shadow: 2px 0 var(--glitch-color1);
            animation: glitch-anim-1 1s infinite linear alternate-reverse;
        }
        a:hover::after {
            left: 2px; text-shadow: -2px 0 var(--glitch-color2);
            animation: glitch-anim-2 1s infinite linear alternate-reverse;
        }
        @keyframes glitch-anim-1 { 0% { clip: rect(42px, 9999px, 44px, 0); } 20% { clip: rect(12px, 9999px, 62px, 0); } 40% { clip: rect(50px, 9999px, 102px, 0); } 60% { clip: rect(30px, 9999px, 80px, 0); } 80% { clip: rect(90px, 9999px, 2px, 0); } 100% { clip: rect(10px, 9999px, 55px, 0); } }
        @keyframes glitch-anim-2 { 0% { clip: rect(5px, 9999px, 95px, 0); } 20% { clip: rect(80px, 9999px, 10px, 0); } 40% { clip: rect(25px, 9999px, 70px, 0); } 60% { clip: rect(65px, 9999px, 35px, 0); } 80% { clip: rect(40px, 9999px, 85px, 0); } 100% { clip: rect(100px, 9999px, 20px, 0); } }

        h1 { font-size: 2em; margin: 0; }
        p { margin-top: 0.5em; }
        .section-title { font-weight: 700; margin-top: 2rem; margin-bottom: 1rem; display: block; }
        .comment { opacity: 0.6; }
        .prompt { display: inline; }
        .cursor { display: inline-block; width: 10px; height: 1.2em; background-color: var(--text-color); animation: blink 1s step-end infinite; vertical-align: bottom; }
        @keyframes blink { 50% { opacity: 0; } }
        ul { list-style-type: none; padding-left: 0; }
        li::before { content: '> '; white-space: pre; }
        .job-title { font-weight: 700; }
        .job-date { float: right; font-style: italic; }
        
        #boot-sequence { padding-bottom: 2rem; }

        @media (max-width: 600px) {
            body { padding: 1rem; font-size: 14px; }
            .job-date { float: none; display: block; }
        }
    </style>
</head>
