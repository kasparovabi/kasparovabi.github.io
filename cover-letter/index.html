            max-width: 800px;
            width: 100%;
            padding: 4rem 3rem;
            position: relative;
            color: var(--text-color);
            border: 1px solid #ccc;
        }

        .stamp {
            position: absolute;
            top: 2rem;
            left: 2rem;
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--stamp-color);
            border: 5px double var(--stamp-color);
            padding: 0.5rem 1rem;
            transform: rotate(-8deg);
            opacity: 0;
            animation: stamp-in 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            transform-origin: center;
        }
        @keyframes stamp-in {
            0% { transform: scale(3) rotate(-30deg); opacity: 0; }
            100% { transform: scale(1) rotate(-8deg); opacity: 0.8; }
        }

        .content {
            margin-top: 4rem;
            visibility: hidden;
            line-height: 1.8;
            font-size: 16px;
        }
        
        .redacted {
            background-color: var(--text-color);
            color: transparent;
            user-select: none;
            transition: background-color 0.3s ease;
        }
        .redacted:hover {
            background-color: rgba(51, 51, 51, 0.3);
            color: var(--text-color);
        }

        .highlight { font-weight: 700; }
        a { color: var(--link-color); text-decoration: underline; }
        p { margin: 1.5em 0; }
        ul { list-style-type: none; padding-left: 0; }
        li::before { content: '• '; }
        
        .cursor { display: inline-block; width: 10px; height: 1.2em; background-color: var(--text-color); animation: blink 1s step-end infinite; vertical-align: bottom; }
        @keyframes blink { 50% { opacity: 0; } }

        @media (max-width: 600px) {
            body { padding: 0; }
            .dossier { padding: 3rem 1.5rem; }
        }
    </style>
</head>
<body>
    <div class="dossier">
        <div class="stamp" id="stamp-element">CLASSIFIED</div>
        
        <div id="boot-sequence"></div>
        <div class="content" id="terminal">
             <!-- İçerik JavaScript ile eklenecek -->
        </div>
    </div>

    <script>
        const stampSound = "data:audio/wav;base64,UklGRiQSAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQASAABmsyZpAAb/hfgG+PsF/v7/3/L+wPK+7f61/er8m/0q/T4BBAJBASf90/zR/Gv8W/w3+8L6xvmD+NL46vi2+Mb2o/Tn9RkGCQoTAyv/x/6r/vT/7/3g/jMBEwJIAwP9i/v3+aP2P/Uu9oPzRPHA8JrwnPCq8PPvxu9g8PD2CgWJCFgJjAOb/wL+S/ys/ND8l/yU/DL7Tfoq+cD10/Fo8gXxWfB18QXvxfB9844B0gaRC3EG6gfM/97/B/95/9X/3P53/1L/9f5Q/4f/2P/o/0MABAAFAAoAAf8c/u3+yf7N/iT+w/zC/Pj8Ff37/An8kPuf9/L6xfc8+fP6fvl49aD2j/bE+CX+AwcEBAQHAgv+Nf+3AOMCCgK9/wX/m/5G/0z+yf/P/2v/n/9Q/4H/7/9QAAgAJQA1AAH+Nf+z/0kCjwbSC6MGrAfTCAEM9gg5DOcGCgL8B3kKcgYd/1wGgQf9BPf+rfiG9oH0MvbX+oX9/v/VAAQADgAIAAEABgAC/4P92P2C/dL99f0J/Vz8HPuV+mP7HvwN/Tz8PfuG+o/64voI/Pz/CQQFCAQPA/3/6gEWA2AEHwK7/9P+x/4F/e367/cO9/71v/L68pTyW/D778brQ/Gv+WwJ9C5kQ4RKnFA4TCBE2FlkK1gB9ANX/3f9E/+7/gv+7/zcA6AHcAy0FhgeGCYgKkguUDJIOXg8+EdATWBZAF1QY1BtuG/Qe0iEAIwYkHyePKLAptivALbIu8jEgM5A15jjLOlI81D3kPxZBUEJqQ+JFEkYwRnJHgkk1SxtLi0wQTWhOuk/5VD1XSVm+W7pe/mL+gP6R/qT+sP62/o7+W/54/i7+NP4X/hf+IP4e/gT+Ff4e/gr+Cf4J/gr+FP4W/hX+Ev4P/gz+AP76/vH+3P7S/sL+tP7C/sH+zv7g/vD/GP8l/zT/Rf9X/2H/bv99/4v/nP+v/8H/yv/T/+v/+v8E/wn/DP8T/xr/HP8f/yP/Jf8v/zf/QP9F/0n/TP9S/1b/XP9f/2P/Z/9r/3P/eP9//4f/iv+P/5X/mP+f/6b/q/+v/7X/uv/E/8j/zf/T/9f/3f/h/w==";
        
        const bootLines = [
            'Receiving secure transmission...',
            'Source: ahmetkazankaya.dev',
            'Destination: goodjobgames.com/hiring',
            'Decrypting packet...',
            'Authentication successful.',
            ' ',
            'Displaying message:',
            ' '
        ];
        
        const terminalContent = `
            <p><span class="highlight">Subject: AI Engineer Position - Proactive Solution Prototype</span></p>
            <p>Dear Hiring Manager,</p>
            <p>
                Player feedback is a goldmine for any successful game, but manually analyzing <span class="redacted">thousands</span> of comments for <span class="redacted">actionable</span> insights is a significant challenge. Instead of just telling you I can build solutions for problems like this, I decided to show you.
            </p>
            <p>
                For my application, I developed a fully functional AI pipeline using <span class="highlight">n8n.io</span> and <span class="highlight">Google's Gemini 2.5 Flash</span>. This automation captures player feedback, performs real-time sentiment and topic classification (Bug Report, Feature Request), and routes detailed alerts to the appropriate teams on Slack. This is the kind of practical, efficiency-driving solution I am passionate about building.
            </p>
            
            <ul>
                <li><span class="highlight">ASSET-01 // DEMONSTRATION:</span> <a href="https://www.loom.com/share/a096887d7df84dca85ea4e91e8602c8b?sid=98f7fef1-4d58-4067-b333-9db402e3305f" target="_blank">Access Video Feed</a></li>
                <li><span class="highlight">ASSET-02 // TECHNICAL FILE:</span> <a href="https://github.com/kasparovabi/good-job-games-ai-player-feedback-analyzer" target="_blank">Review Source Code</a></li>
            </ul>

            <p>
                While this project showcases my automation skills, my core expertise lies in generative AI. To provide a more comprehensive view of my work, I've also prepared an interactive, terminal-themed agent profile.
            </p>

            <ul>
                <li><span class="highlight">AGENT PROFILE // A. KAZANKAYA:</span> <a href="https://kasparovabi.github.io" target="_blank">Open Dossier</a></li>
            </ul>

            <p>
                I am confident that my unique blend of creative vision and engineering skill will be a valuable asset to your team. I look forward to discussing how I can contribute to <span class="redacted">Good Job Games</span>.
            </p>
            <p>
                Sincerely,<br>
                Ahmet Kazankaya
            </p>
            <br>
            <span class="comment"># END OF TRANSMISSION</span>
            <span class="cursor"></span>
        `;

        const terminalEl = document.getElementById('terminal');
        const bootContainer = document.getElementById('boot-sequence');
        let bootIndex = 0;
        
        function playStamp() {
            try { new Audio(stampSound).play(); } catch (e) { console.error("Could not play stamp sound.", e); }
        }

        function typeBootSequence() {
            if (bootIndex < bootLines.length) {
                const line = bootLines[bootIndex];
                let charIndex = 0;
                bootContainer.innerHTML += '<br>';
                const lineEl = document.createElement('span');
                bootContainer.appendChild(lineEl);
                
                function typeChar() {
                    if(charIndex < line.length) {
                        lineEl.innerHTML += line.charAt(charIndex);
                        charIndex++;
                        setTimeout(typeChar, 20);
                    } else {
                        bootIndex++;
                        setTimeout(typeBootSequence, 50);
                    }
                }
                typeChar();
            } else {
                 setTimeout(() => {
                    bootContainer.style.display = 'none';
                    terminalEl.style.visibility = 'visible';
                    terminalEl.innerHTML = terminalContent;
                }, 700);
            }
        }
        
        window.onload = function() {
            setTimeout(() => {
                playStamp();
                typeBootSequence();
            }, 500);
        }
    </script>
</body>
